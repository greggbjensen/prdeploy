{{- $fullName := include "prdeploy-api.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "prdeploy-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  # A ReadWriteOnce volume and the LiteDB file lock allow only one pod at a time.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "prdeploy-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "prdeploy-api.selectorLabels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- if .Values.global.image.pullSecret }}
        - name: {{ .Values.global.image.pullSecret }}
        {{- end }}
      serviceAccountName: {{ include "prdeploy-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "prdeploy-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- if .Values.externalSecrets }}
            - secretRef:
                name: {{ $fullName }}-external
            {{- end }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.aspnetcore_environment }}
            - name: ApolloSandbox__Enabled
              value: {{ .Values.apollo_sandbox_enabled | quote }}
            {{- if .Values.persistence.enabled }}
            - name: Storage__Local__DatabasePath
              value: {{ .Values.persistence.mountPath }}/deployment-storage.db
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.targetPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /app/secrets
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
      - name: secrets
        secret:
          secretName: {{ $fullName }}
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ $fullName }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
