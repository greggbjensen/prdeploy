global:
  nameOverride: ""
  fullnameOverride: "prdeploy"
  ingress:
    host: localhost:4301
    tls:
      secretName: prdeploy-tls
  aws:
    region: us-west-2
    secretPathPrefix: /prdeploy
  image:
    registry: greggbjensen
    pullSecret: docker-credentials
  serviceAccounts:
    backend:
      create: true
      automount: true
      annotations: {}
      name: "prdeploy-backend"

# GitHub organizations (or personal account logins) whose members may sign in to prdeploy.
# Users must be an active member of one of these, and can only use repositories they contribute to
# within them. Nobody can sign in while this list is empty.
allowedOrganizations: []

storage:
  aws:
    tableName: PrDeployStorage

# Persistent volume for the BLite database used by the Local storage provider (Storage:Provider=Local).
# The chart ships with the AWS provider, so this is off by default.
persistence:
  enabled: false
  mountPath: /app/data
  size: 1Gi
  accessMode: ReadWriteOnce
  # Leave empty to use the cluster default storage class.
  storageClass: ""
  annotations: {}

aspnetcore_environment: production
apollo_sandbox_enabled: false

logging:
  # Serilog level for GitHub App webhook processing, such as Debug, Information or Warning.
  webhooksLevel: Information

externalSecrets:
  GitHubAuth__ClientId: GitHubAuth__ClientId
  GitHubAuth__ClientSecret: GitHubAuth__ClientSecret
  Jwt__Key: Jwt__Key
  Jwt__TokenEncryptionKey: Jwt__TokenEncryptionKey
  # GitHub App used for webhooks, these keep the Parameter Store names used by the former prdeploy-webhooks chart.
  GitHubApp__AppId: APP_ID
  GitHubApp__WebhookSecret: WEBHOOK_SECRET
  GitHubApp__PrivateKey: gh_app_key.pem

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

image:
  repository: prdeploy-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

nameOverride: ""
fullnameOverride: "prdeploy-api"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 300m
    memory: 256Mi

autoscaling:
  # Webhook events are queued, cached and de-duplicated in memory, so keep a single replica.
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
