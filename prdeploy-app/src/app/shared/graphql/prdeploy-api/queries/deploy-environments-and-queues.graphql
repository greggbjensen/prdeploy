query DeployEnvironmentsAndQueues($input: RepoQueryInput!) {
  deployEnvironments(input: $input) {
    name
    url
    urls {
      label
      url
    }
    color
    locked
    pullRequest {
      number
      title
      body
      url
      updatedAt
      user {
        name
        username
        avatarUrl
        url
      }
    }
  }
  deployQueues(input: $input) {
    environment
    pullRequests {
      number
      title
      body
      url
      updatedAt
      user {
        name
        username
        avatarUrl
        url
      }
    }
  }
}
