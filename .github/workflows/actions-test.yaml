name: actions - test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/actions-test.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Test ${{ matrix.action }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - build-details
          - get-build-info
    defaults:
      run:
        working-directory: .github/actions/${{ matrix.action }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/actions/${{ matrix.action }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format-check

      - name: Test
        run: npm test -- --coverage

      - name: Bundle
        run: npm run package

  shell:
    name: Test shell actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Lint scripts
        run: shellcheck .github/actions/date-version/*.sh .github/actions/deploy-tags/*.sh .github/actions/*/__tests__/*.sh

      - name: Test date-version
        run: .github/actions/date-version/__tests__/date-version.test.sh

      - name: Test deploy-tags
        run: .github/actions/deploy-tags/__tests__/deploy-tags.test.sh
