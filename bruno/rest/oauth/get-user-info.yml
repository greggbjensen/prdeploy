info:
  name: Get current user info
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/api/oauth/userinfo"
  auth:
    type: bearer
    token: "{{jwt}}"
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.login
      operator: isString
settings:
  encodeUrl: true
docs: |-
  Returns the authenticated GitHub user's profile fields used by the portal. Set `jwt` to a valid prdeploy token returned by the access-token exchange. This endpoint requires authentication.

  Swagger/OpenAPI: [GET /api/oauth/userinfo](http://localhost:4302/openapi/v1.json#/paths/~1api~1oauth~1userinfo/get)

  Implementation: `prdeploy-api/src/PrDeploy.Api/Program.cs`.
