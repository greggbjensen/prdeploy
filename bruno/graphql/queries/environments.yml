info:
  name: List environments
  type: graphql
  seq: 5
  tags:
    - query
graphql:
  method: POST
  url: '{{baseUrl}}/graphql'
  auth:
    type: bearer
    token: '{{jwt}}'
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: |-
      query Environments($input: RepoQueryInput!) {
        environments(input: $input) {
          name
          url
        }
      }
    variables: |-
      {
        "input": {
          "owner": "{{owner}}",
          "repo": "{{repo}}"
        }
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns GraphQL data without errors", function () {
          expect(res.status).to.equal(200);
          expect(res.body.errors).to.be.undefined;
        });
settings:
  encodeUrl: true
docs: >-
  Lists the configured environments for a repository.


  Client operation:
  [environments.graphql](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-app/src/app/shared/graphql/prdeploy-api/queries/environments.graphql).

  Server schema:
  [DeployEnvironmentQuery.cs](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-api/src/PrDeploy.Api/Schema/Queries/DeployEnvironmentQuery.cs).

  Required environment: `owner`, `repo`, and a valid `jwt`.
