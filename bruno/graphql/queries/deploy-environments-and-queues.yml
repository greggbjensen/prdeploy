info:
  name: Deploy environments and queues
  type: graphql
  seq: 1
  tags:
    - query
graphql:
  method: POST
  url: '{{baseUrl}}/graphql'
  auth:
    type: bearer
    token: '{{jwt}}'
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: |-
      query DeployEnvironmentsAndQueues($input: RepoQueryInput!) {
        deployEnvironments(input: $input) {
          name
          url
          urls {
            label
            url
          }
          color
          locked
          pullRequest {
            number
            title
            body
            url
            updatedAt
            user {
              name
              username
              avatarUrl
              url
            }
          }
        }
        deployQueues(input: $input) {
          environment
          pullRequests {
            number
            title
            body
            url
            updatedAt
            user {
              name
              username
              avatarUrl
              url
            }
          }
        }
      }
    variables: |-
      {
        "input": {
          "owner": "{{owner}}",
          "repo": "{{repo}}"
        }
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns GraphQL data without errors", function () {
          expect(res.status).to.equal(200);
          expect(res.body.errors).to.be.undefined;
        });
settings:
  encodeUrl: true
docs: >-
  Lists deploy environments and their queued pull requests for a repository.


  Client operation:
  [deploy-environments-and-queues.graphql](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-app/src/app/shared/graphql/prdeploy-api/queries/deploy-environments-and-queues.graphql).

  Server schema:
  [DeployEnvironmentQuery.cs](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-api/src/PrDeploy.Api/Schema/Queries/DeployEnvironmentQuery.cs)
  and
  [DeployQueueQuery.cs](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-api/src/PrDeploy.Api/Schema/Queries/DeployQueueQuery.cs).

  Required environment: `owner`, `repo`, and a valid `jwt`.
