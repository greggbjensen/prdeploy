info:
  name: Enable repository
  type: graphql
  seq: 6
  tags:
    - mutation
graphql:
  method: POST
  url: '{{baseUrl}}/graphql'
  auth:
    type: bearer
    token: '{{jwt}}'
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: |-
      mutation OwnerRepoAddEnabled($input: RepositoryInput!) {
        ownerRepoAddEnabled(input: $input) {
          success
        }
      }
    variables: |-
      {
        "input": {
          "owner": "{{owner}}",
          "repo": "{{repo}}"
        }
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns GraphQL data without errors", function () {
          expect(res.status).to.equal(200);
          expect(res.body.errors).to.be.undefined;
        });
settings:
  encodeUrl: true
docs: >-
  Enables a repository for prdeploy. This changes the owner's enabled repository list; check the
  target before sending.


  Client operation:
  [owner-repo-add-enabled.graphql](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-app/src/app/shared/graphql/prdeploy-api/mutations/owner-repo-add-enabled.graphql).

  Server schema:
  [OwnerRepoMutation.cs](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-api/src/PrDeploy.Api/Schema/Mutations/OwnerRepoMutation.cs).

  Required environment: `owner`, `repo`, and a valid `jwt`.
