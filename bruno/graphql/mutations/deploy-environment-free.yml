info:
  name: Free environment
  type: graphql
  seq: 2
  tags:
    - mutation
graphql:
  method: POST
  url: '{{baseUrl}}/graphql'
  auth:
    type: bearer
    token: '{{jwt}}'
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: |-
      mutation DeployEnvironmentFree($input: PullDeployInput!) {
        deployEnvironmentFree(input: $input) {
          success
        }
      }
    variables: |-
      {
        "input": {
          "owner": "{{owner}}",
          "repo": "{{repo}}",
          "environment": "{{environment}}",
          "pullNumber": 0
        }
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns GraphQL data without errors", function () {
          expect(res.status).to.equal(200);
          expect(res.body.errors).to.be.undefined;
        });
settings:
  encodeUrl: true
docs: >-
  Frees a deployment lock for the specified pull request and environment. Review the target before
  sending; this changes deployment state.


  Client operation:
  [deploy-environment-free.graphql](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-app/src/app/shared/graphql/prdeploy-api/mutations/deploy-environment-free.graphql).

  Server schema:
  [DeployEnvironmentMutation.cs](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-api/src/PrDeploy.Api/Schema/Mutations/DeployEnvironmentMutation.cs).

  Required environment: `owner`, `repo`, `environment`, `jwt`, and a valid pull number.
