info:
  name: Roll back environment
  type: graphql
  seq: 3
  tags:
    - mutation
graphql:
  method: POST
  url: '{{baseUrl}}/graphql'
  auth:
    type: bearer
    token: '{{jwt}}'
  headers:
    - name: Content-Type
      value: application/json
  body:
    query: |-
      mutation DeployEnvironmentRollback($input: RollbackInput!) {
        deployEnvironmentRollback(input: $input) {
          success
        }
      }
    variables: |-
      {
        "input": {
          "owner": "{{owner}}",
          "repo": "{{repo}}",
          "environment": "{{environment}}",
          "pullNumber": 0,
          "count": 1
        }
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns GraphQL data without errors", function () {
          expect(res.status).to.equal(200);
          expect(res.body.errors).to.be.undefined;
        });
settings:
  encodeUrl: true
docs: >-
  Rolls an environment back for the specified pull request. This changes deployment state; verify
  the environment and rollback count before sending.


  The command posted to the pull request must be a single line of word arguments and `--` flags; an
  environment or service name containing anything else, such as a newline, returns `BAD_REQUEST` and
  nothing is posted. Comment commands only run for users with write access to the repository.


  Client operation:
  [deploy-environment-rollback.graphql](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-app/src/app/shared/graphql/prdeploy-api/mutations/deploy-environment-rollback.graphql).

  Server schema:
  [DeployEnvironmentMutation.cs](https://github.com/greggbjensen/prdeploy/blob/main/prdeploy-api/src/PrDeploy.Api/Schema/Mutations/DeployEnvironmentMutation.cs).

  Required environment: `owner`, `repo`, `environment`, `jwt`, and a valid pull number.
